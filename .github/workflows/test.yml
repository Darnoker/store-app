name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - order-service
          - product-service
          - user-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Start integration dependencies
        run: |
          docker compose up --detach --wait postgres kafka
          docker compose exec --no-TTY kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic order-topic \
            --partitions 1 \
            --replication-factor 1

      - name: Run tests
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -pl modules/${{ matrix.service }} -am test
