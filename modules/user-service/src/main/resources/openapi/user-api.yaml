openapi: 3.0.3
info: { title: User Service API, version: 0.0.1 }
tags: [ { name: Authentication }, { name: Users } ]
paths:
  /auth/register:
    post:
      tags: [ Authentication ]
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }, '409': { description: Email already used } }
  /auth/login:
    post:
      tags: [ Authentication ]
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AccessToken' } } } }, '401': { description: Invalid credentials } }
  /users/me:
    get:
      tags: [ Users ]
      operationId: getCurrentUser
      responses: { '200': { description: Current profile, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } } }
  /oauth2/jwks:
    get:
      tags: [ Authentication ]
      operationId: getJwks
      responses: { '200': { description: Public signing keys, content: { application/json: { schema: { type: object } } } } }
components:
  schemas:
    RegisterRequest:
      type: object
      required: [ email, password ]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 12, maxLength: 72 }, firstName: { type: string }, lastName: { type: string } }
    LoginRequest:
      type: object
      required: [ email, password ]
      properties: { email: { type: string, format: email }, password: { type: string } }
    AccessToken:
      type: object
      required: [ accessToken, tokenType, expiresIn ]
      properties: { accessToken: { type: string }, tokenType: { type: string, example: Bearer }, expiresIn: { type: integer, format: int64 } }
    UserProfile:
      type: object
      required: [ userId, email, roles, status, createdAt, updatedAt ]
      properties: { userId: { type: string, format: uuid }, email: { type: string }, firstName: { type: string }, lastName: { type: string }, roles: { type: array, items: { type: string } }, status: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
