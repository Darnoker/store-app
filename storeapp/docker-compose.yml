services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eventshop
      POSTGRES_USER: eventshop
      POSTGRES_PASSWORD: eventshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventshop -d eventshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
