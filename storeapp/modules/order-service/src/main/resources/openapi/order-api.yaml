openapi: 3.0.3
info:
  title: Order Service API
  description: API contract for the order service.
  version: 0.0.1
tags:
  - name: Orders
    description: Order operations
paths:
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique order identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
components:
  schemas:
    Order:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          example: CREATED
