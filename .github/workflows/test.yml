name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Start integration dependencies
        run: |
          docker compose up --detach --wait postgres kafka
          docker compose run --rm kafka-init

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test
