server:
  port: 8082
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user-service}
    username: ${DB_USERNAME:eventshop}
    password: ${DB_PASSWORD:eventshop}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
identity:
  issuer: ${USER_SERVICE_ISSUER:http://localhost:8082}
  audience: ${USER_SERVICE_AUDIENCE:storeapp-api}
  private-key-pem: ${USER_SERVICE_PRIVATE_KEY_PEM:}
bootstrap-admin:
  email: ${BOOTSTRAP_ADMIN_EMAIL:}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:}
