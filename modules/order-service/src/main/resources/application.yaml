spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order-service}
    username: ${DB_USERNAME:eventshop}
    password: ${DB_PASSWORD:eventshop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

product-catalog:
  base-url: ${PRODUCT_CATALOG_URL:http://localhost:8081}
