openapi: 3.0.3
info:
  title: Order Service API
  description: API contract for the order service.
  version: 0.0.1
tags:
  - name: Orders
    description: Order operations
paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Invalid request
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique order identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '404':
          description: Order not found
components:
  schemas:
    OrderDTO:
      type: object
      required:
        - orderId
        - customerId
        - items
        - totalAmount
        - currency
        - status
        - createdAt
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDTO'
        totalAmount:
          type: number
          format: decimal
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          type: string
          example: CREATED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderItemDTO:
      type: object
      required: [ orderItemId, productId, productType, productName, unitPrice, quantity ]
      properties:
        orderItemId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productType: { type: string }
        productName: { type: string }
        unitPrice: { type: number, format: decimal }
        quantity: { type: integer, format: int32 }
    CurrencyCode:
      type: string
      enum: [ PLN ]
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'
    CreateOrderItemRequest:
      type: object
      required: [ productId, quantity ]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, format: int32, minimum: 1 }
